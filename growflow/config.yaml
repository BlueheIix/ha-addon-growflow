name: GrowFlow
version: "0.1.0"
slug: growflow
description: "Standalone plant tracking (GrowFlow) as a Home Assistant add-on"
url: "https://github.com/grow-flow/growflow"
arch:
  - aarch64
  - amd64
  - armv7
startup: services
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:sprout
panel_title: GrowFlow
options:
  db_path: "/data/growflow.db"
  log_level: "info"
  allowed_frame_ancestors: "'self',*"
schema:
  db_path: str
  log_level: list(trace|debug|info|warn|error)
  allowed_frame_ancestors: str
image: null
